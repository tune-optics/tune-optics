:root{--bg:#ffffff;--fg:#0E1330;--muted:#4A5075;--line:#E3E6F0;--card:#F6F7FB;}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.65}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:48px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h3{margin:0 0 6px;font-size:18px}.card p{margin:0;color:var(--muted);font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;margin-bottom:12px}
#contact{text-align:center;padding:40px 0 56px;border-top:1px solid var(--line)}
#contact h2{margin:0 0 8px;font-size:24px}
#contact a{color:var(--fg);font-weight:600;font-size:20px;text-decoration:none;border-bottom:3px solid #2F6BFF}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 0 32px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
</style>

}
